name: Jaga Supabase Tetap Aktif

on:
  schedule:
    # berjalan otomatis setiap hari Senin dan Kamis jam 09.00 UTC
    - cron: "0 9 * * 1,4"
  workflow_dispatch: #memungkinkan Anda menjalankan ping manual lewat GitHub

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Kirim request ke Supabase API
        run: |
          curl -X GET "${{ secrets.SUPABASE_URL }}/rest/v1" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_ANON_KEY }}"
